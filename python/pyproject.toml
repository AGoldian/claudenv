[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudenv-memory"
version = "0.1.0"
description = "Local file-based memory backend for Claude Agent SDK — companion to the claudenv Node.js installer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AGoldian" }]
keywords = ["claude", "anthropic", "agent-sdk", "memory", "claudenv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Pinned to ~=0.2 to catch breaking changes on upgrade rather than silently via >=.
    # When the SDK exits alpha and stabilizes, broaden this constraint.
    "claude-agent-sdk ~= 0.2",
    "PyYAML >= 6.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
]

[project.urls]
Homepage = "https://github.com/AGoldian/claudenv"
Repository = "https://github.com/AGoldian/claudenv"
Issues = "https://github.com/AGoldian/claudenv/issues"

[tool.hatch.build.targets.wheel]
packages = ["claudenv_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
